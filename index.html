<!DOCTYPE html>
<html>
<head>
    <meta name="google-adsense-account" content="ca-pub-5878201608537821">
    <title>Discount Calculator</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #eef2f3; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 300px; margin: auto; }
        input { width: 80%; padding: 8px; margin: 8px 0; }
        button { padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body style="text-align: center; background-color: lightblue;">

    <h2>Welcome to My First Web Page!</h2>
    <p>This is a web tool project.</p>
    <button onclick="alert('Hello! Web Development Started!')">Click Here!</button>

    <div class="box">
        <h2>Discount Calculator</h2>
        <input type="number" id="price" placeholder="Original Price (Rs.)">
        <input type="number" id="discount" placeholder="Discount %">
        <br><br>
        <button onclick="calculate()">Calculate</button>
        <h3 id="result"></h3>
    </div>

    <script>
        function calculate() {
            let p = document.getElementById('price').value;
            let d = document.getElementById('discount').value;
            if (p && d) {
                let save = p * (d / 100);
                let finalPrice = p - save;
                document.getElementById('result').innerText = 'Final Price: Rs. ' + finalPrice;
            } else {
                document.getElementById('result').innerText = 'Enter valid numbers!';
            }
        }
    </script>

</body>
</html>
